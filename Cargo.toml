[workspace]
resolver = "3"
members = ["crates/tc-core", "crates/tc-pty", "crates/tc-hook", "src-tauri", "xtask"]
exclude = ["vendor/portable-pty"]

[patch.crates-io]
portable-pty = { path = "vendor/portable-pty" }

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

# Exact versions; Cargo.lock is committed as well.
[workspace.dependencies]
ada-url = "=4.0.0"
anyhow = "=1.0.104"
arboard = { version = "=3.7.0", default-features = false }
base64 = "=0.23.1"
dirs = "=7.0.0"
gethostname = "=1.1.0"
portable-pty = "=0.9.0"
regex = "=1.13.1"
rustix = { version = "=1.1.6", features = ["process"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
sha2 = "=0.11.1"
tauri = "=2.12.5"
tauri-build = "=2.7.4"
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-opener = "=2.7.2"
tokio = { version = "=1.54.1", features = ["sync", "time", "macros", "rt"] }
uuid = { version = "=1.29.2", features = ["v4"] }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects"] }
tc-core = { path = "crates/tc-core" }
tc-pty = { path = "crates/tc-pty" }

[workspace.lints.rust]
unsafe_code = "deny"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
