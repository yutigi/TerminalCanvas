[package]
name = "terminal-canvas"
description = "Terminal Canvas: a spatial desktop workspace for AI terminals."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
default-run = "terminal-canvas"

[features]
e2e = []

[dependencies]
arboard.workspace = true
axum.workspace = true
rcgen = { version = "=0.14.10", default-features = false, features = ["ring"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std"] }
serde.workspace = true
serde_json.workspace = true
subtle.workspace = true
tauri.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-opener.workspace = true
tauri-plugin-updater.workspace = true
tc-core.workspace = true
tc-pty.workspace = true
tc-tmux.workspace = true
time = "=0.3.55"
tokio.workspace = true
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring"] }
uuid.workspace = true

[target.'cfg(windows)'.dependencies]
webview2-com = "=0.39.1"
windows = "=0.62.2"

[build-dependencies]
tauri-build.workspace = true

[dev-dependencies]
base64.workspace = true
futures-util = "=0.3.34"
tower = { version = "=0.5.3", features = ["util"] }
tokio-tungstenite = "=0.28.0"

[lints]
workspace = true
