# Runs on every pull request and on main (docs/rust-migration-plan.md, "Development and CI").
# All three jobs must pass before a merge. Windows is the primary target.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # npm 10 (Node 22) accepts package-lock.json; npm 11 asks for optional Windows packages.
          node-version: 22
          cache: npm

      - name: Install the Rust toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install
          rustc --version

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux webview libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install npm dependencies
        run: npm ci

      - name: JavaScript syntax
        run: npm run check

      - name: UI and host tests (JavaScript)
        run: npm test

      - name: Golden fixtures are current and machine-independent
        run: node scripts/capture-golden.cjs --check

      - name: rustfmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --workspace

      - name: Native icons match the shared SVG
        run: cargo xtask icons --check

      - name: Clipboard preservation guard (private pasteboard only)
        if: runner.os == 'macOS'
        run: |
          mkdir -p .cache/native-board-check
          xcrun swiftc -module-cache-path .cache/swift-module-cache tests/manual/macos-clipboard-guard.swift -o .cache/native-board-check/clipboard-guard
          .cache/native-board-check/clipboard-guard --self-test

      - name: Test-only host compiles and passes its tests
        run: cargo test -p terminal-canvas --features e2e

      - name: Test-only host clippy
        run: cargo clippy -p terminal-canvas --all-targets --features e2e -- -D warnings

      # Phase 2 done-checks: real shells report directories (and, with integration, AI sessions)
      # through the UI-free example. The AI CLIs are local stand-ins; nothing calls a service.
      - name: Build tc-hook for the shell integration
        run: cargo build -p tc-hook

      - name: Drive Bash (directories, Duplicate, Claude and Codex capture)
        if: runner.os != 'Windows'
        run: cargo run -p tc-pty --example drive -- --shell bash --ai

      - name: Drive zsh (polled directories)
        if: runner.os == 'macOS'
        run: cargo run -p tc-pty --example drive -- --shell zsh

      # One step per shell: a multi-line PowerShell step only fails on its last command.
      - name: Drive Windows PowerShell 5.1 (directories, readiness, Claude and Codex capture)
        if: runner.os == 'Windows'
        run: cargo run -p tc-pty --example drive -- --ai

      - name: Drive PowerShell 7
        if: runner.os == 'Windows'
        run: cargo run -p tc-pty --example drive -- --shell pwsh --ai

      - name: Drive cmd
        if: runner.os == 'Windows'
        run: cargo run -p tc-pty --example drive -- --shell cmd

      - name: Build the isolated desktop E2E host
        if: runner.os == 'Windows'
        run: cargo build -p terminal-canvas --features e2e

      - name: WebView2 desktop and restoration parity (10 consecutive runs)
        if: runner.os == 'Windows'
        timeout-minutes: 90
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 10; $attempt++) {
            Write-Host "Desktop E2E run $attempt of 10"
            npm run test:e2e
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Upload desktop E2E screenshots
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-desktop-e2e
          path: .cache/tauri-*.png
          if-no-files-found: ignore
